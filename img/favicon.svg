<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e283d" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card matching RY brand badge -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <!-- RY Monogram in bold high-contrast font -->
  <text x="32" y="43" font-family="'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="29" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">RY</text>
</svg>
